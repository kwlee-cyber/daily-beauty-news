name: 1-Hour Beauty News Crawler

on:
  schedule:
    - cron: '0 * * * *' # 매 시 0분 실행
  workflow_dispatch: # 수동 버튼 활성화

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Call Crawl API
        run: |
          curl -X GET "https://본인의-버셀-주소.vercel.app/api/crawl" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          